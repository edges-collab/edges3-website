<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>EDGES Web Interface</title>
    <script>
      // the light/dark theme before the page draws (src/state/Theme.tsx keeps it after)
      (function () {
        var m = "auto"
        try { m = localStorage.getItem("edges.theme") || "auto" } catch (e) {}
        var dark = m === "dark" || (m !== "light" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.setAttribute("data-bs-theme", dark ? "dark" : "light")
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
